    /* =========================================
       ROTARS — NOVEL READING PAGE

       作品：OMN
       篇章：TEASER
       標題：Soft Before the Noise

       ★ 小說閱讀排版
       ★ 章節插圖
       ★ Google 公開留言
       ★ 電腦 / iPad / 手機適用
    ========================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #211811;
      color: #E9DDCC;

      font-family:
        "Noto Serif TC",
        Georgia,
        serif;
    }

    /* =========================================
       主內容區
    ========================================= */

    .reading-main {
      min-width: 0;

      padding-top:
        calc(var(--header-height, 100px) + 45px);

      padding-bottom: 85px;
    }

    .reading-container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
    }

    /* =========================================
       返回小說目錄
    ========================================= */

    .reading-back {
      display: inline-block;

      margin-bottom: 30px;

      color: #C9B69B;
      text-decoration: none;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 17px;
      letter-spacing: 1px;
    }

    .reading-back:hover {
      color: #F5E9D9;
    }

    /* =========================================
       羊皮紙閱讀區
    ========================================= */

    .reading-paper {
      position: relative;
      isolation: isolate;

      min-width: 0;

      padding: 65px 65px 75px;

      background:
        radial-gradient(
          ellipse at 50% 20%,
          rgba(248, 235, 214, 0.35),
          transparent 75%
        ),
        linear-gradient(
          135deg,
          #D3C1A8,
          #C7B49A 55%,
          #BDA78D
        );

      border: 1px solid #8C745D;

      box-shadow:
        0 20px 48px rgba(0, 0, 0, 0.32);
    }

    .reading-paper::before {
      content: "";
      position: absolute;
      inset: 12px;

      border:
        1px solid rgba(91, 65, 45, 0.35);

      pointer-events: none;
      z-index: -1;
    }

    /* =========================================
       章節標題
    ========================================= */

    .chapter-header {
      text-align: center;
      margin-bottom: 45px;
    }

    .chapter-series {
      margin: 0 0 25px;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 15px;
      letter-spacing: 4px;

      color: #765D48;
    }

    .chapter-type {
      margin: 0 0 15px;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 17px;
      letter-spacing: 5px;

      color: #6D5340;
    }

    .chapter-title {
      margin: 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: clamp(35px, 5vw, 54px);
      font-weight: 500;
      line-height: 1.2;

      color: #38271E;
    }

    /* =========================================
       古典分隔線
    ========================================= */

    .chapter-divider {
      display: flex;
      align-items: center;
      gap: 18px;

      max-width: 370px;
      margin: 38px auto;

      color: #775B45;
    }

    .chapter-divider::before,
    .chapter-divider::after {
      content: "";

      flex: 1;
      height: 1px;

      background:
        rgba(91, 65, 45, 0.35);
    }

    .chapter-divider span {
      flex-shrink: 0;
      font-size: 17px;
    }

    /* =========================================
       章節插圖

       圖片完整顯示
       不強制裁切
    ========================================= */

    .chapter-illustration {
      width: 100%;
      max-width: 720px;

      margin: 0 auto 55px;

      text-align: center;
    }

    .chapter-illustration img {
      display: block;

      width: 100%;
      height: auto;

      object-fit: contain;

      border:
        1px solid rgba(91, 65, 45, 0.25);
    }

    /* =========================================
       小說正文

       ★ 段首縮排兩個中文字
       ★ 適合繁體中文橫排小說
       ★ 不使用兩端強制對齊
       ★ 段落自然排列
    ========================================= */

    .novel-body {
      width: 100%;
      max-width: 690px;

      margin: 0 auto;

      color: #35271F;

      font-family:
        "Noto Serif TC",
        "PMingLiU",
        serif;

      font-size: 17px;
      font-weight: 400;

      line-height: 2.25;

      letter-spacing: 0.045em;

      text-align: left;

      overflow-wrap: break-word;
    }

    .novel-body p {
      margin: 0;

      text-indent: 2em;
    }

    /* 場景轉換分隔 */

    .novel-scene-break {
      margin: 35px 0;

      text-align: center;
      text-indent: 0;

      letter-spacing: 8px;
      color: #80664F;
    }

    /* =========================================
       章節結束
    ========================================= */

    .chapter-ending {
      margin: 65px auto 0;

      text-align: center;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 16px;
      letter-spacing: 4px;

      color: #765D48;
    }

    /* =========================================
       返回目錄按鈕
    ========================================= */

    .chapter-navigation {
      display: flex;
      justify-content: center;

      margin-top: 35px;
    }

    .chapter-navigation a {
      display: inline-block;

      padding: 13px 24px;

      border:
        1px solid rgba(91, 65, 45, 0.55);

      color: #49352A;
      text-decoration: none;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 17px;
      letter-spacing: 1px;

      transition:
        background 0.2s ease;
    }

    .chapter-navigation a:hover {
      background:
        rgba(91, 65, 45, 0.1);
    }

    /* =========================================
       留言區

       Google Apps Script
       Readers' Notes
    ========================================= */

    .comments-section {
      margin-top: 60px;
      padding-top: 45px;

      border-top:
        1px solid rgba(91, 65, 45, 0.4);
    }

    .comments-heading {
      margin-bottom: 25px;
      text-align: center;
    }

    .comments-heading h2 {
      margin: 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 38px;
      font-weight: 500;

      color: #39291F;
    }

    .comments-heading p {
      margin: 7px 0 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 18px;
      font-style: italic;

      color: #765B46;
    }

    .comments-frame {
      display: block;

      width: 100%;
      height: 800px;

      border: none;
      background: #C7B49A;
    }

    .comments-fallback {
      margin-top: 15px;

      text-align: center;

      font-size: 13px;
      line-height: 1.8;

      color: #765B46;
    }

    .comments-fallback a {
      color: #49352A;
      text-underline-offset: 4px;
    }

    /* =========================================
       頁尾
    ========================================= */

    .reading-footer {
      margin-top: 60px;

      padding-top: 25px;

      border-top:
        1px solid rgba(91, 65, 45, 0.35);

      text-align: center;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 13px;
      letter-spacing: 2px;

      color: #765D48;
    }

    /* =========================================
       iPad
    ========================================= */

    @media
      (min-width: 701px)
      and
      (max-width: 1100px) {

      .reading-paper {
        padding: 55px 40px 65px;
      }

      .novel-body {
        font-size: 16.5px;
      }

      .comments-frame {
        height: 850px;
      }

    }

    /* =========================================
       手機
    ========================================= */

    @media (max-width: 700px) {

      .reading-main {
        padding-top:
          calc(var(--header-height, 100px) + 30px);

        padding-bottom: 100px;
      }

      .reading-paper {
        padding: 40px 22px 50px;
      }

      .reading-paper::before {
        inset: 8px;
      }

      .chapter-series {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .chapter-type {
        font-size: 15px;
      }

      .chapter-title {
        font-size: 37px;
      }

      .chapter-header {
        margin-bottom: 35px;
      }

      .chapter-illustration {
        margin-bottom: 40px;
      }

      .novel-body {
        font-size: 15.5px;
        line-height: 2.15;

        letter-spacing: 0.02em;
      }

      .chapter-ending {
        margin-top: 45px;
      }

      .comments-section {
        margin-top: 45px;
        padding-top: 35px;
      }

      .comments-heading h2 {
        font-size: 32px;
      }

      .comments-frame {
        height: 900px;
      }

    }

  </style>

          <!-- =================================
               
<section class="novel-body">

  <p>午後的布魯克林帶著一種剛好鬆弛下來的溫度，陽光不再銳利，卻仍舊帶著餘熱，斜斜地穿過街道兩側重新翻修過的紅磚建築，落在一扇半開的窗上。窗內的空氣安靜而柔軟，像被光線輕輕撫過一樣，細微的塵粒在光束中緩慢漂浮。</p>

  <p>那間不算寬敞卻被精心整理過的公寓裡，牆面是溫潤的米白色，搭配低調的木質家具，整體顯得乾淨、克制又帶點生活感。靠牆立著一面幾乎佔滿整面空間的落地鏡，鏡面將整個午後收進來，也將三個女人的身影完整映出。</p>

  <p>絲質晚宴服在光線下泛著細膩的光澤，隨著呼吸輕輕起伏。</p>

  <p>「自從大學畢業舞會之後，我就再也沒有穿過這麼緊的禮服了……」</p>

  <p>珞塔站在鏡前，肩膀微微往後收，像是在適應布料緊貼身體的壓迫感。她吸了一口氣，肋骨微微撐開，背後的拉鍊還沒完全拉上。</p>

  <p>阿格妮絲站在她身後，指尖穩穩地扣住拉鍊頭，順著背脊往上拉。動作俐落而準確，沒有多餘的猶豫，像她處理文件一樣乾脆</p>

  <p>「好了。」</p>

  <p>金屬拉鍊收合的聲音在安靜的房間裡顯得格外清晰</p>

  <p>珞塔下意識地吐出剛才憋住的氣，肩膀微微放鬆，但下一秒又皺起眉，「想到我要這樣撐一整晚……我看我真的不用吃晚餐了。」</p>

  <p>她伸手拿起梳妝台上的香水瓶，輕輕點在側頸與鎖骨之間。透明液體在肌膚上化開，帶出一股乾淨又帶點冷調的香氣，像她整個人一樣——不張揚，但讓人記住</p>

  <p>「就說了不要挑這種貼身的版型。」阿格妮絲語氣平穩，卻帶著一點無奈的笑意。她抬手將自己的長髮盤起，動作熟練，幾縷髮絲自然垂落在頸側，再用電捲在髮尾輕輕捲出弧度，讓整體看起來不至於過於嚴肅。</p>

  <p>她透過鏡子打量珞塔，目光在她側身的瞬間停住</p>

  <p>「不過……妳這個開衩，真的高得有點過分。」</p>

  <p>那道從大腿外側一路延伸上去的剪裁，在光線下幾乎沒有遮掩，白皙的肌膚隨著她的動作若隱若現。</p>

  <p>珞塔無奈地笑了一下，「我一進店，店員就直接拿這件給我。」她一手拿著黑鑽耳飾，一手拿著細長的銀墜，「哪個？」</p>

  <p>阿格妮絲幾乎沒有思考，「銀的。」</p>

  <p>她看了一眼珞塔的整體，「線條比較乾淨，跟妳比較像。」</p>

  <p>「好。」珞塔點點頭，將黑鑽放回盒子裡</p>

  <p>就在這時，換衣間的門被推開</p>

  <p>「唉唷——」</p>

  <p>蒂莉安小心翼翼地提著裙擺走出來，布料在她腳邊堆疊出柔軟的波紋。她整個人站在門口，像還沒準備好接受自己此刻的模樣。</p>

  <p>鏡子裡的兩人同時看向她</p>

  <p>珞塔忍不住笑出聲，「天啊，這是我看過妳最好看的一套。」</p>

  <p>那件低胸無肩的禮服將蒂莉安平常不太展露的曲線完全勾勒出來，肩線柔軟，鎖骨線條清晰，整個人像被重新定義了一樣</p>

  <p>「真的嗎？」蒂莉安的手還停在胸口，不太自在地調整著領口，「我覺得這套讓我很不安……」</p>

  <p>她低頭看了一眼自己，像是不太確定這是不是她</p>

  <p>就在三人還在鏡前討論時，珞塔的手機震動了一下。</p>

  <p>她低頭看了一眼來電顯示，神情瞬間認真起來，「喂，你好？」</p>

  <p>阿格妮絲在鏡中看了她一眼，沒有打擾。</p>

  <p>電話那頭的聲音簡潔而專業，「上東城那間公寓，有另一位租客願意接受妳的合租條件。」</p>

  <p>珞塔的眼睛亮了一下</p>

  <p>「妳要訂嗎？」</p>

  <p>「當然要！」她幾乎是立刻回應，語氣裡壓不住興奮。那間公寓她看過好幾次，光線、格局、位置，全都剛好踩在她心上。「什麼時候可以簽約？」</p>

  <p>「這週末方便嗎？」對方翻著資料，「目前房客會在新年前搬走，妳可以新年後入住。」</p>

  <p>「沒問題。」她忍不住在原地輕輕轉了一圈，「那就這樣定了，謝謝你，曼卡森先生。」</p>

  <p>電話掛斷的瞬間，她整個人像鬆開了一口氣。</p>

  <p>「怎麼了？」阿格妮絲側過頭問</p>

  <p>珞塔轉身看著她，笑得很直接，「新年過後，我不用再借住妳家了。」</p>

  <p>她眼裡的光幾乎藏不住，「我的房子確定了。」</p>

  <p>阿格妮絲愣了一秒，隨即勾起嘴角，「終於啊。」她語氣輕鬆，甚至帶點誇張地伸了個懶腰，「我終於可以獨享我的空間了。」</p>

  <p>但她的視線在珞塔身上停了一瞬，沒有說出口的那點不習慣，被她很好地收了起來。</p>

  <p>「謝謝妳這段時間收留我。」珞塔走過去，輕輕抱了一下她。</p>

  <p>「少來。」阿格妮絲拍了她一下，但沒有推開。</p>

  <p>「美女們，好了嗎？」蒂利安看了一眼時間，「車差不多到了。」</p>

  <p>珞塔拿起皮革手拿包，腳踩進高跟鞋的那一刻，整個人的氣場像被拉直了一樣。原本的柔軟收進去，取而代之的是一種乾淨、冷靜又帶距離的優雅。</p>

  <p>阿格妮絲披上西裝式外套，線條俐落，像她平常在會議室裡的樣子，只是今晚多了一點光澤與精緻。</p>

  <p>蒂莉安則抓著披肩，小心翼翼地跟在後面。</p>

  <p>「走吧。」珞塔回頭看她們，「今晚好好玩一晚。」</p>
