    /* =========================================
       RotaRS — CHARACTERS

       十位人物總覽
       煙燻羊皮紙版本

       ★ 本檔案：characters.html
       ★ 十張肖像完整顯示
       ★ 每張照片連結對應個人頁
    ========================================= */


    /* =========================================
       頁面基本設定
    ========================================= */

    .characters-main {
      min-width: 0;

      padding-top:
        calc(var(--header-height, 100px) + 65px);

      padding-bottom: 55px;
    }

    .characters-intro {
      margin-bottom: 55px;
    }

    .characters-eyebrow {
      margin: 0 0 16px;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 15px;
      letter-spacing: 4px;

      color: #B9A899;
    }

    .characters-intro h1 {
      margin: 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: clamp(48px, 6vw, 76px);
      font-weight: 500;
      line-height: 1.1;

      color: #F2E9DC;
    }

    .characters-description {
      margin: 20px 0 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 21px;
      line-height: 1.5;

      color: #B9A899;
    }


    /* =========================================
       煙燻羊皮紙

       主色：#C7B49A
       暖棕色漸層
       英倫雙線細框
    ========================================= */

    .cast-letter {
      position: relative;
      isolation: isolate;

      min-width: 0;

      padding: 54px 46px 62px;

      background-color: #C7B49A;

      background-image:

        radial-gradient(
          ellipse at 50% 42%,
          rgba(246, 231, 208, 0.22) 0%,
          rgba(246, 231, 208, 0) 75%
        ),

        linear-gradient(
          135deg,
          #D3C1A8 0%,
          #C7B49A 52%,
          #B8A187 100%
        );

      border: 1px solid #8C745D;

      box-shadow:
        0 20px 48px rgba(0, 0, 0, 0.34),
        inset 0 0 35px rgba(84, 59, 39, 0.06);
    }

    .cast-letter::before {
      content: "";

      position: absolute;
      inset: 12px;

      border:
        1px solid rgba(91, 65, 45, 0.35);

      pointer-events: none;
      z-index: -1;
    }


    /* =========================================
       人物名冊標題
    ========================================= */

    .cast-heading {
      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 10px;

      margin-bottom: 38px;
      padding-bottom: 25px;

      text-align: center;

      border-bottom:
        1px solid rgba(91, 65, 45, 0.35);
    }

    .cast-small-title {
      margin: 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 12px;
      letter-spacing: 3px;

      color: #725B48;
    }

    .cast-heading h2 {
      margin: 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 37px;
      font-weight: 500;
      letter-spacing: 3px;
      line-height: 1.1;

      color: #3E2D23;
    }

    .cast-caption {
      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 18px;
      font-style: italic;
      letter-spacing: 0.8px;

      color: #69503E;
    }


    /* =========================================
       十位人物照片牆

       ★ 桌面：四欄
       ★ iPad：三欄
       ★ 手機：兩欄

       ★ 不裁切照片
       ★ 不設定固定照片高度
    ========================================= */

    .cast-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 26px 22px;

      align-items: start;
    }

    .cast-card {
      display: block;

      min-width: 0;

      color: inherit;
      text-decoration: none;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .cast-photo {
      display: block;

      width: 100%;
      min-width: 0;

      height: auto;
      aspect-ratio: auto;

      overflow: visible;

      background: transparent;

      border: none;
      box-shadow: none;
    }

    .cast-photo img {
      display: block;

      width: 100%;
      max-width: 100%;
      height: auto;

      object-fit: contain;

      border: none;
      border-radius: 0;

      box-shadow:
        0 5px 13px rgba(57, 36, 22, 0.22);

      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }


    /* =========================================
       點擊與觸控效果
    ========================================= */

    .cast-card:active img {
      transform: scale(0.975);
      filter: brightness(0.96);
    }

    .cast-card:focus-visible {
      outline: 2px solid #5A4030;
      outline-offset: 5px;
    }

    @media (hover: hover) and (pointer: fine) {

      .cast-card:hover img {
        transform: translateY(-4px);
      }

    }


    /* =========================================
       頁尾
    ========================================= */

    .characters-footer {
      display: flex;
      justify-content: space-between;

      gap: 20px;

      margin-top: 80px;
      padding-top: 25px;

      border-top:
        1px solid rgba(185, 168, 153, 0.22);

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 14px;
      letter-spacing: 1px;

      color: #B9A899;
    }


    /* =========================================
       iPad / 中型平板
       三欄
    ========================================= */

    @media
      (min-width: 701px)
      and
      (max-width: 1100px) {

      .cast-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));

        gap: 24px 20px;
      }

      .cast-letter {
        padding: 44px 32px 52px;
      }

    }


    /* =========================================
       手機
       兩欄
    ========================================= */

    @media (max-width: 700px) {

      .characters-main {
        padding-top:
          calc(var(--header-height, 100px) + 40px);

        padding-bottom: 115px;
      }

      .characters-intro {
        margin-bottom: 38px;
      }

      .characters-eyebrow {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .characters-intro h1 {
        font-size: 48px;
      }

      .characters-description {
        font-size: 18px;
      }

      .cast-letter {
        padding: 34px 20px 40px;
      }

      .cast-letter::before {
        inset: 8px;
      }

      .cast-heading {
        gap: 8px;

        margin-bottom: 26px;
        padding-bottom: 20px;
      }

      .cast-small-title {
        font-size: 10px;
        letter-spacing: 1.5px;
      }

      .cast-heading h2 {
        font-size: 30px;
      }

      .cast-caption {
        font-size: 15px;
      }

      .cast-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 20px 14px;
      }

      .characters-footer {
        flex-direction: column;

        gap: 8px;
        margin-top: 55px;

        font-size: 12px;
      }

    }


    /* =========================================
       減少動畫偏好
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      .cast-photo img {
        transition: none;
      }

    }
