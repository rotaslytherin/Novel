  <style>

    /* ==============================
       CHARACTERS 頁面基本排版
    ============================== */

    .characters-main {
      padding-top: calc(var(--header-height, 100px) + 65px);
      padding-bottom: 55px;
    }

    .characters-intro {
      margin-bottom: 55px;
    }

    .characters-eyebrow {
      margin: 0 0 16px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 15px;
      letter-spacing: 4px;
      color: #B9A899;
    }

    .characters-intro h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(48px, 6vw, 76px);
      font-weight: 500;
      line-height: 1.1;
      color: #F2E9DC;
    }

    .characters-description {
      margin: 20px 0 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 21px;
      color: #B9A899;
    }


    /* ==============================
       英倫信箋背景
    ============================== */

    .cast-letter {
      position: relative;
      padding: 52px 48px 60px;

      background:
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 31px,
          rgba(130, 110, 89, 0.035) 32px
        ),
        linear-gradient(
          145deg,
          #F1E8D9,
          #E5D8C5
        );

      border: 1px solid #B7A28A;

      box-shadow:
        0 20px 55px rgba(0,0,0,0.32),
        inset 0 0 0 9px rgba(255,255,255,0.20),
        inset 0 0 0 10px rgba(125,99,76,0.22);
    }

    .cast-letter::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(110,85,62,0.22);
      pointer-events: none;
    }

    .cast-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      margin-bottom: 35px;
      padding-bottom: 18px;

      border-bottom: 1px solid rgba(91,70,53,0.35);
    }

    .cast-heading h2 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #47372C;
    }

    .cast-heading span {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 14px;
      letter-spacing: 2px;
      color: #78614E;
    }


    /* ==============================
       人物照片牆
       電腦四欄 / 平板三欄 / 手機兩欄
    ============================== */

    .cast-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 28px;
    }

    .cast-card {
      display: block;
      min-width: 0;
      text-decoration: none;
    }

    .cast-photo {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;

      background: #D5C5AF;
      border: 1px solid rgba(91,70,53,0.30);

      box-shadow: 0 5px 15px rgba(65,45,30,0.12);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .cast-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cast-placeholder {
      background:
        linear-gradient(
          145deg,
          #D8C8B4,
          #BFA98E
        );
    }

    a.cast-card:hover .cast-photo {
      transform: translateY(-5px);
      box-shadow: 0 14px 25px rgba(65,45,30,0.22);
    }

    .characters-footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      margin-top: 80px;
      padding-top: 25px;

      border-top: 1px solid rgba(185,168,153,0.22);

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 14px;
      letter-spacing: 1px;
      color: #B9A899;
    }


    /* ==============================
       平板：三欄
    ============================== */

    @media (max-width: 1100px) {

      .cast-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }

      .cast-letter {
        padding: 42px 34px 50px;
      }

    }


    /* ==============================
       手機：兩欄
    ============================== */

    @media (max-width: 700px) {

      .characters-main {
        padding-top: calc(var(--header-height, 100px) + 40px);
        padding-bottom: 115px;
      }

      .characters-intro {
        margin-bottom: 38px;
      }

      .characters-intro h1 {
        font-size: 48px;
      }

      .characters-eyebrow {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .characters-description {
        font-size: 18px;
      }

      .cast-letter {
        padding: 34px 20px 38px;
      }

      .cast-letter::before {
        inset: 9px;
      }

      .cast-heading {
        margin-bottom: 24px;
        gap: 10px;
      }

      .cast-heading h2 {
        font-size: 23px;
      }

      .cast-heading span {
        font-size: 10px;
        letter-spacing: 1px;
      }

      .cast-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .characters-footer {
        flex-direction: column;
        gap: 8px;
        font-size: 12px;
      }

    }

  </style>

</head>
