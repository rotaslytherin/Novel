
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow, noimageindex"
  >

  <title>CHARACTERS | RotaRS — The Literary Archive</title>

  <link rel="stylesheet" href="style.css?v=5">

  <!-- CHARACTERS 專用樣式 -->
  <style>

    .characters-main {
      padding-top: calc(var(--header-height) + 65px);
      padding-bottom: 55px;
    }

    .characters-intro {
      margin-bottom: 70px;
    }

    .characters-eyebrow {
      margin: 0 0 16px;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 15px;
      letter-spacing: 4px;

      color: #B9A899;
    }

    .characters-intro h1 {
      margin: 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: clamp(48px, 6vw, 76px);
      font-weight: 500;

      letter-spacing: 2px;
      line-height: 1.1;

      color: #F2E9DC;
    }

    .characters-description {
      margin: 20px 0 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 21px;
      letter-spacing: 0.8px;
      line-height: 1.6;

      color: #B9A899;
    }

    .cast-collection {
      margin-bottom: 95px;
    }

    .cast-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 30px;
      padding-bottom: 18px;

      border-bottom:
        1px solid rgba(185,168,153,0.22);
    }

    .cast-heading h2 {
      margin: 0;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 27px;
      font-weight: 500;
      letter-spacing: 2px;

      color: #F2E9DC;
    }

    .cast-heading span {
      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 14px;
      letter-spacing: 2px;

      color: #B9A899;
    }

    /* 人物照片牆 */

    .cast-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 28px;
    }

    .cast-card {
      display: block;
      min-width: 0;
    }

    .cast-photo {
      display: block;

      width: 100%;
      aspect-ratio: 3 / 4;

      overflow: hidden;

      border-radius: 4px;

      border:
        1px solid rgba(185,168,153,0.30);

      background: rgba(56,48,43,0.45);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .cast-placeholder {
      background:
        linear-gradient(
          145deg,
          rgba(56,48,43,0.78),
          rgba(25,20,17,0.78)
        );
    }

    .cast-photo img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    a.cast-card:hover .cast-photo {
      transform: translateY(-5px);

      box-shadow:
        0 15px 30px rgba(0,0,0,0.35);
    }

    .characters-footer {
      display: flex;
      justify-content: space-between;

      gap: 20px;

      padding-top: 25px;

      border-top:
        1px solid rgba(185,168,153,0.22);

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 14px;
      letter-spacing: 1px;

      color: #B9A899;
    }

    /* 平板三欄 */

    @media (max-width: 1100px) {

      .cast-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));

        gap: 22px;
      }

    }

    /* 手機兩欄 */

    @media (max-width: 700px) {

      .characters-main {
        padding-top:
          calc(var(--header-height) + 40px);

        padding-bottom: 115px;
      }

      .characters-intro {
        margin-bottom: 48px;
      }

      .characters-eyebrow {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .characters-intro h1 {
        font-size: 48px;
      }

      .characters-description {
        font-size: 18px;
      }

      .cast-heading {
        margin-bottom: 24px;
        gap: 10px;
      }

      .cast-heading h2 {
        font-size: 22px;
      }

      .cast-heading span {
        font-size: 11px;
        letter-spacing: 1px;
      }

      .cast-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 18px;
      }

      .cast-collection {
        margin-bottom: 65px;
      }

      .characters-footer {
        flex-direction: column;
        gap: 8px;

        font-size: 12px;
      }

    }

  </style>

</head>

<body class="characters-page">

  <div class="site">

    <!-- 頂部品牌區 -->

    <header class="site-header">

      <a href="home.html" class="brand">

        <img
          src="images/IMG_1497.png"
          alt="RotaRS Logo"
          class="brand-logo"
        >

        <div class="brand-text">

          <span class="brand-name">
            RotaRS
          </span>

          <span class="brand-subtitle">
            THE LITERARY ARCHIVE
          </span>

        </div>

      </a>

    </header>


    <!-- 左側導覽列 -->

    <aside class="sidebar">

      <nav
        class="sidebar-nav"
        aria-label="Main Navigation"
      >

        <a href="home.html" class="nav-link">
          HOME
        </a>

        <a href="library.html" class="nav-link">
          LIBRARY
        </a>

        <a
          href="characters.html"
          class="nav-link active"
          aria-current="page"
        >
          CHARACTERS
        </a>

        <span class="nav-link nav-disabled">
          CONTINUE READING
        </span>

      </nav>

      <div class="sidebar-footer">
        ROTA SILVER
      </div>

    </aside>


    <!-- 人物總覽 -->

    <main class="main-content characters-main">

      <section class="characters-intro">

        <p class="characters-eyebrow">
          RotaRS — THE LITERARY ARCHIVE
        </p>

        <h1>The Characters</h1>

        <p class="characters-description">
          The faces behind the stories.
        </p>

      </section>


      <!-- 純照片牆 -->

      <section class="cast-collection">

        <div class="cast-heading">

          <h2>THE CAST</h2>

          <span>EXPLORE THE PROFILES</span>

        </div>

        <div class="cast-grid">

          <div class="cast-card">
            <div class="cast-photo cast-placeholder"></div>
          </div>

          <div class="cast-card">
            <div class="cast-photo cast-placeholder"></div>
          </div>

          <div class="cast-card">
            <div class="cast-photo cast-placeholder"></div>
          </div>

          <div class="cast-card">
            <div class="cast-photo cast-placeholder"></div>
          </div>

          <div class="cast-card">
            <div class="cast-photo cast-placeholder"></div>
          </div>

          <div class="cast-card">
            <div class="cast-photo cast-placeholder"></div>
          </div>

        </div>

      </section>


      <!-- 頁尾 -->

      <footer class="characters-footer">

        <span>
          RotaRS — The Literary Archive
        </span>

        <span>
          © Rota Silver
        </span>

      </footer>

    </main>

  </div>

</body>
</html>
