
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noimageindex">

  <title>RotaRS | The Literary Archive</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="site">

    <!-- 頂部品牌區 -->
    <header class="site-header">
      <a href="index.html" class="brand">
        <img
          src="images/IMG_1497.png"
          alt="RotaRS Logo"
          class="brand-logo"
        >

        <div class="brand-text">
          <span class="brand-name">RotaRS</span>
          <span class="brand-subtitle">
            THE LITERARY ARCHIVE
          </span>
        </div>
      </a>
    </header>

    <!-- 左側導覽列 -->
    <aside class="sidebar">
      <nav class="sidebar-nav" aria-label="網站導覽">
        <a href="index.html" class="nav-link active">
          書庫
        </a>

        <a href="#collection" class="nav-link">
          所有作品
        </a>

        <a href="#about" class="nav-link">
          關於 RotaRS
        </a>
      </nav>

      <div class="sidebar-footer">
        ROTA SILVER
      </div>
    </aside>

    <!-- 主要內容 -->
    <main class="main-content">

      <section class="library-intro">
        <p class="eyebrow">THE LITERARY ARCHIVE</p>
        <h1>The Library</h1>
        <p class="intro-description">
          A collection of stories, characters and worlds.
        </p>
      </section>

      <section class="collection" id="collection">
        <div class="section-heading">
          <h2>所有作品</h2>
          <span>THE COLLECTION</span>
        </div>

        <!-- 未來小說封面會放在這裡 -->
        <div class="book-grid">
          <div class="book-placeholder">
            <span>COMING SOON</span>
          </div>
        </div>
      </section>

      <section class="about-section" id="about">
        <h2>About RotaRS</h2>
        <p>
          Stories by Rota Silver.
        </p>
      </section>

    </main>

  </div>

</body>
</html>
