
<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- 降低搜尋引擎收錄機會 -->

  <meta
    name="robots"
    content="noindex, nofollow, noimageindex"
  >

  <title>HOME | RotaRS — The Literary Archive</title>

  <!-- 全站共用樣式 -->

  <link rel="stylesheet" href="style.css">

</head>

<body class="home-page">

  <div class="site">

    <!-- =========================
         頂部品牌區
    ========================= -->

    <header class="site-header">

      <a href="home.html" class="brand">

        <img
          src="images/IMG_1497.png"
          alt="RotaRS Logo"
          class="brand-logo"
        >

        <div class="brand-text">

          <span class="brand-name">
            RotaRS
          </span>

          <span class="brand-subtitle">
            THE LITERARY ARCHIVE
          </span>

        </div>

      </a>

    </header>


    <!-- =========================
         左側導覽列
    ========================= -->

    <aside class="sidebar">

      <nav
        class="sidebar-nav"
        aria-label="Main Navigation"
      >

        <a
          href="home.html"
          class="nav-link active"
          aria-current="page"
        >
          HOME
        </a>

        <a
          href="library.html"
          class="nav-link"
        >
          LIBRARY
        </a>

        <!-- 人物資料庫待建立 -->

        <span class="nav-link nav-disabled">
          CHARACTERS
        </span>

        <!-- 閱讀紀錄功能待建立 -->

        <span class="nav-link nav-disabled">
          CONTINUE READING
        </span>

      </nav>

      <div class="sidebar-footer">
        ROTA SILVER
      </div>

    </aside>


    <!-- =========================
         HOME 品牌形象首頁
    ========================= -->

    <main class="main-content home-main">

      <section class="home-hero">

        <!-- 中央大型 Logo -->

        <img
          src="images/IMG_1497.png"
          alt="RotaRS Monogram"
          class="home-hero-logo"
        >


        <!-- 品牌名稱 -->

        <h1 class="home-title">
          RotaRS
        </h1>

        <p class="home-subtitle">
          THE LITERARY ARCHIVE
        </p>


        <!-- 裝飾線 -->

        <div
          class="home-divider"
          aria-hidden="true"
        ></div>


        <!-- 品牌標語 -->

        <p class="home-quote">
          Every story begins somewhere.
        </p>


        <!-- 進入書庫 -->

        <a
          href="library.html"
          class="home-enter"
        >
          EXPLORE THE LIBRARY

          <span aria-hidden="true">
            &rarr;
          </span>

        </a>

      </section>


      <!-- 頁尾 -->

      <footer class="home-footer">

        <span>
          © RotaRS · Rota Silver
        </span>

      </footer>

    </main>

  </div>

</body>
</html>
